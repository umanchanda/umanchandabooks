{% extends "layout.html" %}

{% block title %}— Error{% endblock %}

{% block main %}
<div class="apology-wrapper">
    <div class="apology-card">
        <div class="apology-icon"><i class="fa-solid fa-circle-exclamation"></i></div>
        <h1>{{ errorMessage }}</h1>
        <p class="text-muted mb-4">Please go back and try again.</p>
        <a href="javascript:history.back()">
            <i class="fa-solid fa-arrow-left me-1"></i> Go Back
        </a>
    </div>
</div>
{% endblock %}
