{% extends "layout.html" %}

{% block title %}— Log In{% endblock %}

{% block main %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1><i class="fa-solid fa-right-to-bracket me-2"></i>Log In</h1>
        <p class="subtitle">Welcome back — sign in to your account</p>

        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input autofocus class="form-control" id="username" name="username"
                       placeholder="Your username" type="text"/>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password"
                       placeholder="Your password" type="password"/>
            </div>
            <button class="btn btn-primary" type="submit">Log In</button>
        </form>

        <div class="alt-link">
            Don't have an account? <a href="/register">Register</a>
        </div>
    </div>
</div>
{% endblock %}
