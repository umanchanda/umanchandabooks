{% extends "layout.html" %}

{% block title %}— Register{% endblock %}

{% block main %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1><i class="fa-solid fa-user-plus me-2"></i>Register</h1>
        <p class="subtitle">Create an account to start reviewing books</p>

        <form action="/register" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input autofocus class="form-control" id="username" name="username"
                       placeholder="Choose a username" type="text"/>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password"
                       placeholder="Choose a password" type="password"/>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmation">Confirm Password</label>
                <input class="form-control" id="confirmation" name="confirmation"
                       placeholder="Repeat your password" type="password"/>
            </div>
            <button class="btn btn-primary" type="submit">Create Account</button>
        </form>

        <div class="alt-link">
            Already have an account? <a href="/login">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
